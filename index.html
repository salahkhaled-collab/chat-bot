<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FAF6EE" />
    <title>Sports Bot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">S</span>
          <div>
            <h1>Sports Bot</h1>
            <p>Sports management assistant</p>
          </div>
        </div>
        <button id="reset" class="new-chat" type="button">New chat</button>
      </header>

      <main id="log" class="log" aria-live="polite"></main>

      <form id="form" class="composer" autocomplete="off">
        <label for="input" class="visually-hidden">Message</label>
        <textarea id="input" rows="1" placeholder="Ask about any sport…" required></textarea>
        <button id="send" type="submit">Send</button>
      </form>
      <p class="hint">Enter to send · Shift + Enter for a new line</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
